name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  unit-and-component:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Check types
        run: bun run check

      - name: Lint and format
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit -- --run

      - name: Component tests
        run: |
          printf 'PUBLIC_CONVEX_URL=%s\nPUBLIC_CONVEX_SITE_URL=%s\n' "$PUBLIC_CONVEX_URL" "$PUBLIC_CONVEX_SITE_URL" > .env
          bun run test:component -- --run

  e2e:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211
      SITE_URL: http://localhost:5173
      VITE_SITE_URL: http://localhost:5173
      BETTER_AUTH_SECRET: dev-e2e-only-secret-do-not-use-in-prod-0000000000
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate SvelteKit config
        run: bun run check

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Write Convex env for anonymous local backend
        run: |
          printf 'SITE_URL=%s\nVITE_SITE_URL=%s\nBETTER_AUTH_SECRET=%s\n' "$SITE_URL" "$VITE_SITE_URL" "$BETTER_AUTH_SECRET" > .env.local

      - name: End-to-end tests
        run: bun run test:ai
